<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>Ai lyrics generator</title>
</head>
<body>
    <div class="container">
    <header>
    <h1>Welcome to AI lyrics generator</h1>
    </header>

    <main>
        <form id="lyrics-generator-form">
            <input type="text" placeholder="Enter the topic of your song" autofocus required autocomplete="off" class="instructions"/>
            <input type="submit" class="submit-button"/>
        </form>
        <div class="lyrics" id="lyrics"></div>
        
    </main>
    <script src="src/index.js"></script>

    <footer>This AI project was created by <a href="https://github.com/Royalty-Ree" target="_blank">Relebohile Puso</a>, 
        it is open-sourced on <a href="https://github.com/Royalty-Ree/Lyrics-generator" target="_blank">Github</a> and 
        hosted on <a href="https://ai-lyrics-generator1.netlify.app/" target="_blank">Netlify</a>
    </footer>
    </div>
</body>
</html>
